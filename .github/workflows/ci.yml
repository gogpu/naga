name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Test - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        go: ['1.25']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Download dependencies
        run: go mod download

      # spirv-val and spirv-dis validate and compare the SPIR-V output; without
      # them those tests skip. Pinned to the development Vulkan SDK's version.
      - name: Cache SPIRV-Tools
        id: spirv-tools-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/spirv-tools
          key: spirv-tools-v2026.1-${{ runner.os }}-${{ hashFiles('.github/scripts/install-spirv-tools.sh') }}

      - name: Build SPIRV-Tools
        if: steps.spirv-tools-cache.outputs.cache-hit != 'true'
        shell: bash
        run: bash .github/scripts/install-spirv-tools.sh "${{ runner.temp }}/spirv-tools"

      - name: Add SPIRV-Tools to PATH
        shell: bash
        run: echo "${{ runner.temp }}/spirv-tools/bin" >> "$GITHUB_PATH"

      - name: Run go vet
        if: matrix.os == 'ubuntu-latest'
        run: go vet ./...

      # A missing spirv-val or spirv-dis fails the tests instead of skipping them.
      - name: Run tests
        shell: bash
        env:
          NAGA_REQUIRE_TOOLS: spirv-val,spirv-dis
        run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

      - name: Verify coverage file
        if: matrix.os == 'ubuntu-latest'
        run: ls -la coverage.txt && echo "$(wc -l < coverage.txt) lines"

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage.txt
          flags: unittests
          name: codecov-naga

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      # Pinned: with "latest" a new release changes the result for an
      # unchanged commit. Upgrade deliberately, together with its findings.
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          args: --timeout=5m

  formatting:
    name: Formatting
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "ERROR: The following files are not formatted:"
            gofmt -l .
            echo ""
            echo "Run 'go fmt ./...' to fix formatting issues."
            exit 1
          fi
          echo "All files are properly formatted"

  build:
    name: Build - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: go build ./...

  fuzz:
    name: Fuzz Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run fuzz tests
        run: |
          cd wgsl
          go test -fuzz=FuzzLexer -fuzztime=30s || true

  # Dependency freshness check
  # Uses go-mod-outdated (https://github.com/psampaz/go-mod-outdated)
  deps:
    name: Dependencies
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25'
        cache: true

    - name: Install go-mod-outdated
      run: go install github.com/psampaz/go-mod-outdated@latest

    - name: Check direct dependencies for updates
      run: |
        echo "## Direct Dependencies with Updates"
        OUTDATED=$(go list -u -m -json all 2>/dev/null | go-mod-outdated -update -direct || true)
        if [ -n "$OUTDATED" ]; then
          echo "$OUTDATED"
          echo "::warning::Some direct dependencies have updates available"
        else
          echo "All direct dependencies are up to date (naga is standalone)"
        fi
